name: CordCloud

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 14 * * *"
    - cron: "13 6 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: Sailffo/cordcloud-action@release
        with:
          email: ${{ secrets.CC_EMAIL }}
          passwd: ${{ secrets.CC_PASSWD }}
